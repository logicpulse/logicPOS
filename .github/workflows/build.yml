name: Build LogicPOS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # Garante o Developer Pack do .NET Framework 4.8
    - name: Install .NET Framework 4.8 Targeting Pack
      run: |
        choco install netfx-4.8-devpack -y

    # Configura o MSBuild
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # Restaura os pacotes da solução inteira para garantir as dependências
    - name: Restore NuGet Packages
      run: nuget restore LogicPOS.sln

    # CORREÇÃO CRUCIAL: Aponta diretamente para o .csproj da UI para forçar a compilação
    - name: Build UI Project
      run: msbuild LogicPOS.UI/LogicPOS.UI.csproj /p:Configuration=Release

    # Captura os ficheiros de todas as pastas bin possíveis
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: LogicPOS-Compiled
        path: |
          **/bin/Release/
          **/bin/x86/Release/
          **/bin/x64/Release/
