name: MSBuild

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # Usa uma máquina Windows do GitHub que já tem o MSBuild instalado
    runs-on: windows-latest

    variables:
      # Caminho para a sua solução (.sln) ou projeto (.csproj)
      SOLUTION_FILE_PATH: LogicPOS.sln

      # Configuração da compilação (Release ou Debug)
      BUILD_CONFIGURATION: Release

    steps:
    - name: Descarregar o código do repositório
      uses: actions/checkout@v4

    - name: Adicionar o MSBuild ao comando de linha (PATH)
      uses: microsoft/setup-msbuild@v2

    - name: Restaurar pacotes NuGet (se o seu projeto usar)
      run: nuget restore ${{ env.SOLUTION_FILE_PATH }}

    - name: Compilar com o MSBuild
      run: msbuild /m /p:Configuration=${{ env.BUILD_CONFIGURATION }} ${{ env.SOLUTION_FILE_PATH }}
