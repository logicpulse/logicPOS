name: MSBuild

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    env:
      # Definido exatamente como no seu comando do Visual Studio
      SOLUTION_FILE_PATH: LogicPOS.sln
      BUILD_CONFIGURATION: Debug
      BUILD_PLATFORM: "Any CPU"

    steps:
    - name: Descarregar o código do repositório
      uses: actions/checkout@v4

    - name: Adicionar o MSBuild ao PATH
      uses: microsoft/setup-msbuild@v2

    # Nota: O seu comando do MSBuild já tem o parâmetro /restore, 
    # por isso o passo separado do NuGet deixa de ser obrigatório.

    # Executa exatamente o comando que forneceu
    - name: Compilar com o MSBuild (Igual ao Visual Studio)
      run: msbuild ${{ env.SOLUTION_FILE_PATH }} /restore /t:Build /p:Configuration=${{ env.BUILD_CONFIGURATION }} /p:Platform="${{ env.BUILD_PLATFORM }}" /verbosity:minimal

    # Guarda o resultado da pasta Debug (onde o projeto principal será gerado)
    - name: Guardar o ficheiro compilado
      uses: actions/upload-artifact@v4
      with:
        name: logicpos-compilado
        path: |
          **/bin/Debug/
          **/bin/Any CPU/Debug/
