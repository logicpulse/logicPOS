name: Build LogicPOS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # Garante o Developer Pack do .NET Framework 4.8
    - name: Install .NET Framework 4.8 Targeting Pack
      run: |
        choco install netfx-4.8-devpack -y

    # Configura o MSBuild
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # Restaura os pacotes da solução inteira
    - name: Restore NuGet Packages
      run: nuget restore LogicPOS.sln

    # Compila a solução e envia todos os binários para uma pasta centralizada 'publish'
    - name: Build and Publish Solution
      run: msbuild LogicPOS.sln /p:Configuration=Release /p:OutDir="${{ github.workspace }}\publish\"

    # (Opcional) Lista os ficheiros na consola para debug, caso precises de inspecionar
    - name: List compiled files
      run: dir /s publish

    # Faz o upload de toda a pasta centralizada como artefacto
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: LogicPOS-Compiled
        path: publish/
