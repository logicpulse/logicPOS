name: Build LogicPOS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Install .NET Framework 4.8 Targeting Pack
      run: choco install netfx-4.8-devpack -y

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore
      run: msbuild LogicPOS.sln /t:Restore /p:Configuration=Release

    - name: Build UI (Release|Any CPU)
      run: msbuild LogicPOS.UI/LogicPOS.UI.csproj /p:Configuration=Release /p:Platform="Any CPU"

    - name: Collect UI output
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path publish | Out-Null
        Copy-Item "..\artifacts\logicpos\Release\*" "publish\" -Recurse -Force

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: LogicPOS-Compiled
        path: publish/
