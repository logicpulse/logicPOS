name: MSBuild LogicPOS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    env:
      REPO_ALVO: 'logicpulse/logicPOS'
      SOLUTION_FILE_PATH: LogicPOS.sln
      BUILD_CONFIGURATION: Debug
      BUILD_PLATFORM: "Any CPU"

    steps:
    - name: Descarregar o código do repositório
      uses: actions/checkout@v4

    - name: Criar ficheiro de configuração da API
      run: |
        copy LogicPOS.Api\apisettings.example.json LogicPOS.Api\apisettings.json

    - name: Configurar o comando NuGet
      uses: nuget/setup-nuget@v2
      with:
        nuget-version: 'latest'

    - name: Adicionar o MSBuild ao PATH
      uses: microsoft/setup-msbuild@v2

    - name: Restaurar pacotes NuGet
      run: nuget restore ${{ env.SOLUTION_FILE_PATH }}

    - name: Compilar com o MSBuild
      run: msbuild ${{ env.SOLUTION_FILE_PATH }} /t:Build /p:Configuration=${{ env.BUILD_CONFIGURATION }} /p:Platform="${{ env.BUILD_PLATFORM }}" /verbosity:minimal

    # PASSO NOVO: Copia a pasta externa "artifacts" para dentro da pasta atual do repositório
    - name: Trazer os ficheiros compilados para o repositório
      run: |
        xcopy "..\artifacts\logicpos\Debug" ".\compilacao_final\" /E /I /H /Y

    # Agora o caminho é válido porque aponta para uma pasta interna
    - name: Guardar o executável e ficheiros do LogicPOS
      uses: actions/upload-artifact@v4
      with:
        name: LogicPOS-Instalador-Debug
        path: compilacao_final/
