name: Build LogicPOS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Install .NET Framework 4.8 Targeting Pack
      run: |
        choco install netfx-4.8-devpack -y

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # Importante: Limpa e restaura antes de começar
    - name: Restore NuGet Packages
      run: nuget restore LogicPOS.sln

    # CORREÇÃO: Compila a solução sem forçar a plataforma "Any CPU", permitindo que o MSBuild use o mapeamento correto do .sln
    - name: Build Solution
      run: msbuild LogicPOS.sln /p:Configuration=Release

    # Garante que a pasta bin da UI também entra nos Artifacts
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: LogicPOS-Compiled
        path: |
          **/bin/Release/
          **/bin/x86/Release/
          **/bin/x64/Release/
