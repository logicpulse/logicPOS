name: MSBuild

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    env:
      SOLUTION_FILE_PATH: .
      BUILD_CONFIGURATION: Release

    steps:
    - name: Descarregar o código do repositório
      uses: actions/checkout@v4

    - name: Adicionar o MSBuild ao PATH
      uses: microsoft/setup-msbuild@v2

    - name: Restaurar pacotes NuGet
      run: nuget restore ${{ env.SOLUTION_FILE_PATH }}

    - name: Compilar com o MSBuild
      run: msbuild /m /p:Configuration=${{ env.BUILD_CONFIGURATION }} ${{ env.SOLUTION_FILE_PATH }}

    # NOVO PASSO: Guarda o resultado da compilação no GitHub
    - name: Guardar o ficheiro compilado
      uses: actions/upload-artifact@v4
      with:
        name: meu-projeto-compilado
        # Procura por tudo o que foi gerado dentro das pastas bin/Release/
        path: |
          **/bin/Release/
